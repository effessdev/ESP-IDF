site_name: ESP-IDF Docs by EffessDev
site_description: Free and ad-free learning platform for ESP-IDF.
site_author: EffessDev

theme:
  name: material
  palette:
    # Scheme toggle for Light/Dark mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.top
    - content.code.copy # Adds a copy button to code blocks
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences # Enhanced code block features

nav:
  - Home: index.md
